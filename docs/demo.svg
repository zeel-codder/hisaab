<text x="410.0" y="24" text-anchor="middle" class="title">hisaab: read-only Mac disk report</text>
<text x="32" y="82" class="fg k1"><tspan class="b">❯</tspan> my mac is almost full, what can I clean?</text>
<text x="32" y="109" class="dim k2"><tspan class="o">●</tspan> Where should I save the report? Default: the skill's reports/ folder.</text>
<text x="32" y="136" class="fg k3"><tspan class="b">❯</tspan> default is fine</text>
<text x="32" y="171" class="fg k4"><tspan class="o">●</tspan> Read-only scan</text>
<rect x="220" y="159" width="440" height="12" rx="3" fill="#21262d" class="k5"/>
<rect x="220" y="159" width="440" height="12" rx="3" fill="#58a6ff" class="bar k6"/>
<text x="676" y="171" class="g k7">done</text>
<text x="54" y="198" class="dim sm k8"><tspan class="g">✓</tspan> disk</text>
<text x="129.60000000000002" y="198" class="dim sm k9"><tspan class="g">✓</tspan> home</text>
<text x="205.20000000000005" y="198" class="dim sm k10"><tspan class="g">✓</tspan> ~/Library</text>
<text x="322.80000000000007" y="198" class="dim sm k11"><tspan class="g">✓</tspan> Docker</text>
<text x="415.20000000000005" y="198" class="dim sm k12"><tspan class="g">✓</tspan> Homebrew</text>
<text x="524.4000000000001" y="198" class="dim sm k13"><tspan class="g">✓</tspan> Mole dry run</text>
<text x="32" y="235" class="fg k14"><tspan class="g">●</tspan> Report saved: <tspan class="b">reports/hisaab-2026-10-20.md</tspan></text>
<text x="54" y="262" class="dim k15"><tspan class="fg">7.1 GB free</tspan> of 245 GB</text>
<text x="54" y="293" class="fg k16">Safe to clean</text>
